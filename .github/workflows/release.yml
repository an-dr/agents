name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Agent Skills reference validator
        run: pipx install "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"
      - name: Run every skill test and repository check
        run: python3 tests/run-all.py --all
      - name: Package
        run: python skills/_repository/an-dr-agents-repo-build-release/scripts/package.py --tag "${{ github.ref_name }}" --out-directory out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="${GITHUB_REF_NAME#v}"
          version="${label%%-pre.*}"
          prerelease=()
          if [ "$label" != "$version" ]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" out/agents-"$label".zip out/SHA256SUMS "${prerelease[@]}" \
            --title "agents $label" --notes-file "docs/releases/$version.md"
